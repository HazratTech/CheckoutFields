name: Build and Deploy CheckoutFields

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/checkoutfields:latest

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Pull and restart Container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/checkoutfields:latest
          
          docker rm -f checkoutfields || true
          
          docker run -d \
            --name checkoutfields \
            --network custom_bridge \
            --ip 172.25.0.51 \
            --env-file /home/envs/checkoutfields.env \
            -p 8085:3000 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/checkoutfields:latest

          sleep 5
          docker ps | grep checkoutfields
