api_version = "2025-10"

[[extensions]]
name = "Fieldy: Custom Field & Note"
handle = "checkout-fields"
uid = "914da4f3-b78e-a869-6db4-7a34f741f346011d6bc7"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/OrderStatus.jsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
api_access = true
network_access = false
block_progress = true

[[extensions.metafields]]
namespace = "checkout_fields"
key = "plan"


[extensions.settings]
[[extensions.settings.fields]]
key = "field_title"
type = "single_line_text_field"
name = "Field Label / Title"
description = "Label displayed above the input (e.g., Gift Message, Delivery Notes, VAT/Tax ID)"

[[extensions.settings.fields]]
key = "field_type"
type = "single_line_text_field"
name = "Field Type"
description = "Choose input type. Free: text, multiline | Pro: select, checkbox, number, date"
  [[extensions.settings.fields.validations]]
  name = "choices"
  value = '["text", "multiline", "select", "checkbox", "number", "date"]'

[[extensions.settings.fields]]
key = "field_placeholder"
type = "single_line_text_field"
name = "Placeholder Text"
description = "Hint text shown inside the input field"

[[extensions.settings.fields]]
key = "attribute_key"
type = "single_line_text_field"
name = "Order Attribute Key"
description = "Name saved in Order Note Attributes (e.g., gift_message, vat_number)"

[[extensions.settings.fields]]
key = "field_required"
type = "boolean"
name = "Required Field (Pro Plan)"
description = "Block checkout until filled (Pro Plan feature - also requires 'Allow app to block checkout' toggle above)"

[[extensions.settings.fields]]
key = "max_characters"
type = "number_integer"
name = "Character Limit (Optional)"
description = "Maximum allowed characters (e.g. 50 for gift tags, 150 for greeting cards). Displays a live counter."

[[extensions.settings.fields]]
key = "target_countries"
type = "single_line_text_field"
name = "Show Only in Countries (Optional)"
description = "Comma-separated ISO country codes (e.g., US, CA or GB, DE, FR). Leave blank to show everywhere."

[[extensions.settings.fields]]
key = "option_1"
type = "single_line_text_field"
name = "Dropdown Option 1 (Pro Plan)"
description = "First choice in the dropdown menu (e.g. Instagram, Yes, Morning)"

[[extensions.settings.fields]]
key = "option_2"
type = "single_line_text_field"
name = "Dropdown Option 2 (Pro Plan)"
description = "Second choice in the dropdown menu (e.g. TikTok, No, Afternoon)"

[[extensions.settings.fields]]
key = "option_3"
type = "single_line_text_field"
name = "Dropdown Option 3 (Pro Plan)"
description = "Third choice in the dropdown menu (e.g. Google Search, Evening)"

[[extensions.settings.fields]]
key = "option_4"
type = "single_line_text_field"
name = "Dropdown Option 4 (Pro Plan)"
description = "Fourth choice in the dropdown menu (e.g. Friend / Family)"

[[extensions.settings.fields]]
key = "option_5"
type = "single_line_text_field"
name = "Dropdown Option 5 (Pro Plan)"
description = "Fifth choice in the dropdown menu (e.g. Other / Not Listed)"

[[extensions.settings.fields]]
key = "option_6"
type = "single_line_text_field"
name = "Dropdown Option 6 (Pro Plan)"
description = "Sixth choice in the dropdown menu (Optional)"

[[extensions.settings.fields]]
key = "select_options"
type = "multi_line_text_field"
name = "Bulk / Paste Options (Optional)"
description = "Or paste additional options separated by newlines or commas"

[[extensions.settings.fields]]
key = "field_help_text"
type = "single_line_text_field"
name = "Help Text"
description = "Small explanation displayed below the field"


