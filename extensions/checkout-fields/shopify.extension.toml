api_version = "2025-07"

[[extensions]]
name = "CheckoutFields"
handle = "checkout-fields"
uid = "914da4f3-b78e-a869-6db4-7a34f741f346011d6bc7"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
api_access = true
network_access = false
block_progress = true

[[extensions.metafields]]
namespace = "checkout_fields"
key = "plan"


[extensions.settings]
[[extensions.settings.fields]]
key = "field_title"
type = "single_line_text_field"
name = "Field Label / Title"
description = "Label displayed above the input (e.g., Gift Message, Delivery Notes, VAT/Tax ID)"

[[extensions.settings.fields]]
key = "field_type"
type = "single_line_text_field"
name = "Field Type"
description = "Free: text, multiline | Pro Plan: select, checkbox, number"

[[extensions.settings.fields]]
key = "field_placeholder"
type = "single_line_text_field"
name = "Placeholder Text"
description = "Hint text shown inside the input field"

[[extensions.settings.fields]]
key = "attribute_key"
type = "single_line_text_field"
name = "Order Attribute Key"
description = "Name saved in Order Note Attributes (e.g., gift_message, vat_number)"

[[extensions.settings.fields]]
key = "field_required"
type = "boolean"
name = "Required Field (Pro Plan)"
description = "Block checkout until filled (Pro Plan feature - also requires 'Allow app to block checkout' toggle above)"

[[extensions.settings.fields]]
key = "select_options"
type = "multi_line_text_field"
name = "Dropdown Options (Pro Plan)"
description = "Comma or newline separated options (Used only when Field Type is select)"

[[extensions.settings.fields]]
key = "field_help_text"
type = "single_line_text_field"
name = "Help Text"
description = "Small explanation displayed below the field"
